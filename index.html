<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Spatial</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f4f6f9; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            width: 320px; 
        }
        h2 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 20px; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        .button-mod { 
            display: flex; 
            gap: 10px; 
            margin-top: 15px; 
        }
        button { 
            flex: 1; 
            padding: 12px; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold; 
            transition: background 0.2s; 
        }
        .reg-btn { background-color: #28a745; }
        .reg-btn:hover { background-color: #218838; }
        .login-btn { background-color: #007bff; }
        .login-btn:hover { background-color: #0069d9; }
        #message { 
            margin-top: 15px; 
            text-align: center; 
            font-weight: bold; 
            min-height: 20px; 
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Spatial Auth</h2>
        <form id="authForm" onsubmit="return false;">
            <input type="text" id="username" placeholder="Имя" required>
            <input type="password" id="password" placeholder="Пароль (мин 8)" required>
            <div class="button-mod">
                <button type="button" class="reg-btn" onclick="sendRequest('register')">Register</button>
                <button type="button" class="login-btn" onclick="sendRequest('login')">LogIn</button>
            </div>
        </form>
        <div id="message"></div>
    </div>

    <script>
    async function sendRequest(actionType) {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('message');

        if (!username || !password) {
            messageDiv.style.color = 'red';
            messageDiv.innerText = 'Заполните все поля!';
            return;
        }

        // Адрес строго на бэкенд Axum (с префиксом /api)
        const url = actionType === 'register' 
            ? 'http://localhost:8081/api/auth/register' 
            : 'http://localhost:8081/api/auth/login';
        messageDiv.style.color = 'black';
        messageDiv.innerText = 'Отправка...';

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Если статус 200 (Login) или 201 (Register)
                messageDiv.style.color = 'green';
                messageDiv.innerText = data.message || 'Успешно!';
                document.getElementById('authForm').reset();
            } else {
                // Если сервер вернул ошибку через структуру ApiResponse { error }
                messageDiv.style.color = 'red';
                messageDiv.innerText = data.error || 'Произошла ошибка на сервере.';
            }

        } catch (err) {
            messageDiv.style.color = 'red';
            messageDiv.innerText = 'Нет связи с сервером Rust.';
            console.error(err);
        }
    }
    </script>

</body>
</html>
